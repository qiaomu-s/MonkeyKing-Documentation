name: Internal API audit

on:
  workflow_dispatch:

# This workflow is intentionally limited to trusted master runs. The protected
# source repository and version are supplied through repository variables; the
# read-only token is supplied through a protected secret.
permissions:
  contents: read

concurrency:
  group: internal-api-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_REPOSITORY: ${{ vars.MONKEYKING_SOURCE_REPOSITORY }}
      SOURCE_REF: ${{ vars.MONKEYKING_SOURCE_REF }}
      AUDIT_DIR: ${{ runner.temp }}/monkeyking-api-audit
    steps:
      - name: Check out documentation
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Install pinned npm
        run: npm install --global npm@11.17.0

      - name: Verify npm version
        run: test "$(npm --version)" = "11.17.0"

      - name: Install dependencies
        run: npm ci

      - name: Validate protected audit inputs
        env:
          SOURCE_TOKEN: ${{ secrets.MONKEYKING_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SOURCE_REPOSITORY}" || -z "${SOURCE_REF}" || -z "${SOURCE_TOKEN}" ]]; then
            echo 'Protected API audit inputs are not configured.' >&2
            exit 1
          fi

      - name: Generate and verify the protected API projection
        env:
          SOURCE_TOKEN: ${{ secrets.MONKEYKING_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "${AUDIT_DIR}"
          mkdir -m 700 -p "${AUDIT_DIR}"
          askpass="${AUDIT_DIR}/askpass"
          internal_manifest="${AUDIT_DIR}/manifest.internal.json"
          printf '#!/usr/bin/env sh\nprintf "%%s\\n" "$SOURCE_TOKEN"\n' > "${askpass}"
          chmod 700 "${askpass}"
          export GIT_ASKPASS="${askpass}"
          export GIT_TERMINAL_PROMPT=0
          export GIT_CONFIG_NOSYSTEM=1

          if ! git clone --quiet --no-checkout --filter=blob:none --no-tags \
            "https://x-access-token@github.com/${SOURCE_REPOSITORY}.git" \
            "${AUDIT_DIR}/source" >"${AUDIT_DIR}/checkout.log" 2>&1; then
            echo 'Protected API source checkout failed.' >&2
            exit 1
          fi
          if ! git -C "${AUDIT_DIR}/source" fetch --quiet --depth=1 origin "${SOURCE_REF}" \
            >>"${AUDIT_DIR}/checkout.log" 2>&1; then
            echo 'Protected API source version fetch failed.' >&2
            exit 1
          fi
          if ! git -C "${AUDIT_DIR}/source" checkout --quiet --detach "${SOURCE_REF}" \
            >>"${AUDIT_DIR}/checkout.log" 2>&1; then
            echo 'Protected API source version selection failed.' >&2
            exit 1
          fi

          run_silently() {
            local label="$1"
            shift
            local log_file="${AUDIT_DIR}/${label}.log"
            if ! "$@" >"${log_file}" 2>&1; then
              echo "Protected API audit failed during ${label}." >&2
              exit 1
            fi
          }

          run_silently extract \
            npm run api:extract -- \
              --source "${AUDIT_DIR}/source" \
              --ref "${SOURCE_REF}" \
              --internal-output "${internal_manifest}" \
              --check
          run_silently mime \
            npm run api:mime -- \
              --source "${AUDIT_DIR}/source" \
              --ref "${SOURCE_REF}" \
              --check
          run_silently coverage \
            npm run api:coverage -- \
              --internal-manifest "${internal_manifest}" \
              --check

          echo 'Protected API audit completed.'

      - name: Remove protected API source and audit material
        if: always()
        env:
          AUDIT_DIR: ${{ runner.temp }}/monkeyking-api-audit
        run: |
          set +e
          if [[ -d "${AUDIT_DIR}" ]]; then
            find "${AUDIT_DIR}" -type f -exec shred --force --remove=wipesync {} + 2>/dev/null || true
            rm -rf "${AUDIT_DIR}"
          fi
