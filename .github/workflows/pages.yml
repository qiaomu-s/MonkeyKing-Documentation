name: Pages

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out Monkey King 6.7.0 source
        uses: actions/checkout@v7
        with:
          repository: qiaomu-s/AutoJs6
          ref: bafa2986212d27b6b59f1324f89548b72a810966
          token: ${{ secrets.MONKEYKING_SOURCE_TOKEN }}
          path: .source/monkeyking
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@11.17.0

      - name: Verify npm version
        run: test "$(npm --version)" = "11.17.0"

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Verify fixed API surface
        run: npm run api:extract -- --source .source/monkeyking --ref bafa2986212d27b6b59f1324f89548b72a810966 --check

      - name: Check API documentation coverage
        run: npm run api:check

      - name: Check JavaScript examples
        run: npm run examples:check

      - name: Check content catalog
        run: npm run check:content

      - name: Build compatibility JSON
        run: npm run json:build

      - name: Reject compatibility JSON drift
        run: git diff --exit-code -- api-surface json

      - name: Run unit tests
        run: npm test

      - name: Build web documentation
        run: npm run build:web

      - name: Check generated links
        run: npm run check:links

      - name: Build Android documentation
        run: npm run build:android

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/web

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
