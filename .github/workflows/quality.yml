name: Quality

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.ref == 'refs/heads/master'
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@11.17.0

      - name: Verify npm version
        run: test "$(npm --version)" = "11.17.0"

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Verify API coverage manifest
        run: npm run api:coverage -- --check

      - name: Check API documentation coverage
        run: npm run api:check

      - name: Check JavaScript examples
        run: npm run examples:check

      - name: Check content catalog
        run: npm run check:content

      - name: Build compatibility JSON
        run: npm run json:build

      - name: Reject compatibility JSON drift
        run: git diff --exit-code -- api-surface json

      - name: Run unit tests
        run: npm test

      - name: Build web documentation
        run: npm run build:web

      - name: Build Android documentation
        run: npm run build:android

      - name: Scan public documentation boundary
        run: npm run public:scan

      - name: Check generated links
        run: npm run check:links

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e
